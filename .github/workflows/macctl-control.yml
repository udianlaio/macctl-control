name: macctl-control-r3

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'macctl:request' &&
      github.actor == 'udianlaio' &&
      github.actor_id == '73857148' &&
      github.event.issue.user.id == 73857148
    runs-on: [self-hosted, linux, x64, hermes-macctl-control]
    timeout-minutes: 20
    steps:
      - name: Dispatch typed R3 request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          issue = os.environ['GH_ISSUE_NUMBER']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def api(method, path, payload=None, ignore_404=False):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if ignore_404 and exc.code == 404:
                      return None
                  raise

          def add_labels(*labels):
              api('POST', f'/issues/{issue}/labels', {'labels': list(labels)})

          def remove_label(label):
              quoted = urllib.parse.quote(label, safe='')
              api('DELETE', f'/issues/{issue}/labels/{quoted}', ignore_404=True)

          add_labels('macctl:r3', 'macctl:running')
          remove_label('macctl:request')
          remove_label('macctl:r1')
          remove_label('macctl:r2')
          remove_label('macctl:passed')
          remove_label('macctl:failed')

          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)
          body = event.get('issue', {}).get('body') or ''

          try:
              cp = subprocess.run(
                  ['sudo', '-n', '/usr/local/libexec/macctl-github-dispatch'],
                  input=body,
                  text=True,
                  capture_output=True,
                  timeout=1140,
              )
              raw = (cp.stdout or '').strip()
              try:
                  result = json.loads(raw)
              except Exception:
                  result = {'ok': False, 'error': 'dispatcher_non_json_output', 'returncode': cp.returncode}
          except Exception:
              result = {'ok': False, 'error': 'workflow_dispatch_exception'}

          summary = {
              'ok': result.get('ok', False),
              'request_id': result.get('request_id'),
              'operation': result.get('operation'),
              'returncode': result.get('returncode'),
              'duration_ms': result.get('duration_ms'),
              'idempotent_replay': result.get('idempotent_replay'),
              'error': result.get('error'),
              'control_version': result.get('control_version'),
              'head': result.get('head'),
              'changed': result.get('changed'),
              'state': result.get('state'),
              'target': result.get('target'),
              'delay_seconds': result.get('delay_seconds'),
              'boot_changed': result.get('boot_changed'),
              'sentinelx_active': result.get('sentinelx_active'),
              'github_runner_active': result.get('github_runner_active'),
              'scheduled_at_epoch': result.get('scheduled_at_epoch'),
              'completed_at_epoch': result.get('completed_at_epoch'),
              'local_bundle_id': result.get('local_bundle_id'),
              'run_id': os.environ['GH_RUN_ID'],
              'run_attempt': os.environ['GH_RUN_ATTEMPT'],
          }
          summary = {k: v for k, v in summary.items() if v is not None}
          checks = result.get('checks') or []
          safe_checks = [
              {'name': x.get('name'), 'ok': bool(x.get('ok')), 'returncode': x.get('returncode'), 'duration_ms': x.get('duration_ms'), 'error': x.get('error')}
              for x in checks
          ]
          capabilities = result.get('capabilities') or []
          diagnostics = result.get('diagnostics') or {}
          fleet_summary = result.get('fleet_summary') or diagnostics.get('fleet') or {}
          actions = result.get('actions') or []
          last_event = result.get('last_event')

          safe_report = {
              'schema': 'macctl-github-r3-safe-report/v1',
              'repository': repo,
              'issue_number': int(issue),
              'summary': summary,
              'checks': safe_checks,
              'capabilities': capabilities,
              'diagnostics': diagnostics,
              'fleet_summary': fleet_summary,
              'actions': actions,
              'last_event': last_event,
          }

          bundle_dir = os.path.join(os.environ['RUNNER_TEMP'], 'macctl-r3-safe-bundle')
          os.makedirs(bundle_dir, exist_ok=True)
          report_path = os.path.join(bundle_dir, 'report.json')
          with open(report_path, 'w', encoding='utf-8') as f:
              json.dump(safe_report, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write('\n')

          md = ['# Linux-macctl GitHub R3 安全诊断摘要', '', '## 任务摘要', '', '```json', json.dumps(summary, ensure_ascii=False, indent=2), '```']
          if safe_checks:
              md += ['', '## 检查明细', '', '| 检查项 | 结果 | 耗时 |', '| --- | --- | ---: |']
              for item in safe_checks:
                  md.append(f"| `{item.get('name')}` | {'PASS' if item.get('ok') else 'FAIL'} | {item.get('duration_ms')} ms |")
          if fleet_summary:
              md += ['', '## Fleet 汇总', '', '```json', json.dumps(fleet_summary, ensure_ascii=False, indent=2), '```']
          if diagnostics:
              md += ['', '## 安全诊断指标', '', '```json', json.dumps(diagnostics, ensure_ascii=False, indent=2), '```']
          with open(os.path.join(bundle_dir, 'summary.md'), 'w', encoding='utf-8') as f:
              f.write('\n'.join(md) + '\n')

          with open(os.path.join(bundle_dir, 'checks.csv'), 'w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['name', 'ok', 'returncode', 'duration_ms', 'error'])
              w.writeheader()
              for item in safe_checks:
                  w.writerow(item)

          lines = [
              '## Linux-macctl GitHub R3 执行结果', '',
              '公开仓库仅回传非敏感摘要；完整原始诊断只保留在 Hermes 本地。', '',
              '```json', json.dumps(summary, ensure_ascii=False, indent=2), '```',
          ]
          if capabilities:
              lines += ['', '### 当前可自主调用能力', '', ', '.join(f'`{x}`' for x in capabilities)]
          if safe_checks:
              lines += ['', '### 检查明细', '', '| 检查项 | 结果 | 耗时 |', '| --- | --- | ---: |']
              for item in safe_checks:
                  lines.append(f"| `{item.get('name')}` | {'PASS' if item.get('ok') else 'FAIL'} | {item.get('duration_ms')} ms |")
          if fleet_summary:
              lines += ['', '### Fleet 汇总', '', '```json', json.dumps(fleet_summary, ensure_ascii=False, indent=2), '```']
          api('POST', f'/issues/{issue}/comments', {'body': '\n'.join(lines)})

          remove_label('macctl:running')
          if result.get('ok', False):
              add_labels('macctl:passed')
              api('PATCH', f'/issues/{issue}', {'state': 'closed', 'state_reason': 'completed'})
          else:
              add_labels('macctl:failed')
              sys.exit(1)
          PY

      - name: Upload R3 safe diagnostic bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macctl-r3-issue-${{ github.event.issue.number }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/macctl-r3-safe-bundle
          if-no-files-found: ignore
          retention-days: 7
