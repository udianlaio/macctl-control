name: macctl-control-r1

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'macctl:request' &&
      github.actor == 'udianlaio' &&
      github.actor_id == '73857148' &&
      github.event.issue.user.id == 73857148
    runs-on: [self-hosted, linux, x64, hermes-macctl-control]
    timeout-minutes: 15
    steps:
      - name: Dispatch typed R1 request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          issue = os.environ['GH_ISSUE_NUMBER']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def api(method, path, payload=None, ignore_404=False):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if ignore_404 and exc.code == 404:
                      return None
                  raise

          def add_labels(*labels):
              api('POST', f'/issues/{issue}/labels', {'labels': list(labels)})

          def remove_label(label):
              quoted = urllib.parse.quote(label, safe='')
              api('DELETE', f'/issues/{issue}/labels/{quoted}', ignore_404=True)

          import urllib.parse

          # Mark request as consumed/running before executing anything.
          add_labels('macctl:r1', 'macctl:running')
          remove_label('macctl:request')
          remove_label('macctl:passed')
          remove_label('macctl:failed')

          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)
          body = event.get('issue', {}).get('body') or ''

          try:
              cp = subprocess.run(
                  ['sudo', '-n', '/usr/local/libexec/macctl-github-dispatch'],
                  input=body,
                  text=True,
                  capture_output=True,
                  timeout=840,
              )
              raw = (cp.stdout or '').strip()
              try:
                  result = json.loads(raw)
              except Exception:
                  result = {
                      'ok': False,
                      'error': 'dispatcher_non_json_output',
                      'returncode': cp.returncode,
                  }
          except Exception:
              result = {'ok': False, 'error': 'workflow_dispatch_exception'}

          summary = {
              'ok': result.get('ok', False),
              'request_id': result.get('request_id'),
              'operation': result.get('operation'),
              'returncode': result.get('returncode'),
              'duration_ms': result.get('duration_ms'),
              'idempotent_replay': result.get('idempotent_replay'),
              'error': result.get('error'),
          }

          lines = [
              '## Linux-macctl GitHub R1 执行结果',
              '',
              '公开仓库仅回传非敏感摘要；完整执行记录保留在 Hermes 本地账本。',
              '',
              '```json',
              json.dumps(summary, ensure_ascii=False, indent=2),
              '```',
          ]
          checks = result.get('checks') or []
          if checks:
              lines += ['', '### 巡检明细', '', '| 检查项 | 结果 | 耗时 |', '| --- | --- | ---: |']
              for item in checks:
                  state = 'PASS' if item.get('ok') else 'FAIL'
                  ms = item.get('duration_ms')
                  lines.append(f"| `{item.get('name')}` | {state} | {ms} ms |")
          comment = '\n'.join(lines)
          api('POST', f'/issues/{issue}/comments', {'body': comment})

          remove_label('macctl:running')
          if result.get('ok', False):
              add_labels('macctl:passed')
          else:
              add_labels('macctl:failed')
              sys.exit(1)
          PY